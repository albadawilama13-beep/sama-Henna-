<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حنة سما</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Tahoma,sans-serif;
background:#f5eee5;
color:#4b3029;
text-align:center;
}

.page{
max-width:600px;
margin:auto;
background:#fffaf4;
min-height:100vh;
overflow:hidden;
}

.top{
padding:45px 25px 25px;
background:linear-gradient(#f7eee3,#fffaf4);
}

.small{
color:#93483c;
font-size:15px;
letter-spacing:2px;
}

h1{
font-family:Georgia,serif;
font-size:70px;
color:#93483c;
margin:15px 0 5px;
}

.henna{
font-size:27px;
margin-top:8px;
}

.line{
width:100px;
height:2px;
background:#b99262;
margin:20px auto;
}

.poem{
font-size:23px;
line-height:2;
margin:25px auto;
max-width:480px;
}

.family{
font-size:17px;
line-height:2;
}

.family strong{
display:block;
font-size:25px;
color:#93483c;
margin:5px;
}

.image{
width:100%;
display:block;
margin-top:15px;
}

.section{
padding:32px 20px;
border-top:1px solid #ead8c6;
}

.label{
font-size:14px;
color:#93483c;
}

.big{
font-size:30px;
font-weight:bold;
margin:10px 0;
}

.date{
font-size:18px;
line-height:1.8;
}

.place{
font-size:23px;
font-weight:bold;
}

.footer{
padding:35px 20px 45px;
background:#f1dfce;
}

.footer-title{
font-size:27px;
color:#93483c;
font-weight:bold;
margin-bottom:12px;
}

.note{
font-size:14px;
}
</style>
</head>

<body>

<div class="page">

<div class="top">

<div class="small">دعوة خاصّة</div>

<div class="henna">حفل حنّاء</div>

<h1>سما</h1>

<div class="line"></div>

<div class="poem">
يا ناقشَ الحنّاءِ على ناعمِ الكفّ<br>
انقُشْ على كفِّ سما السعادة
</div>

<div class="family">
تتشرّف عائلة السيّد
<strong>نور الدين احمد البدوي</strong>
بدعوتكم لحضور حفل حنّاء ابنتهم
</div>

</div>

<img src="bride-groom.png" class="image" alt="العروس والعريس">

<div class="section">
<div class="label">الموعد</div>
<div class="big">٥:٣٠ مساءً</div>
<div class="date">الجمعة ٤ أيلول ٢٠٢٦</div>
</div>

<div class="section">
<div class="label">المكان</div>
<div class="place">منزل والد العروس</div>
</div>

<div class="footer">
<div class="footer-title">جنّة الأطفال منازلهم</div>
<div class="note">نتشرّف بحضوركم ومشاركتكم فرحتنا 🤍</div>
</div>

</div>

</body>
</html>
